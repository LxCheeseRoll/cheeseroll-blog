<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CheeseRoll 的个人博客，分享技术与生活。">
    <meta name="keywords" content="个人博客, 技术分享, 程序员">
    <title id="page-title">芝士卷OvO</title>

    <!-- 音乐播放器（左下角悬浮，与参考图同款样式） -->
    <div id="music-player" class="fixed left-4 bottom-16 z-[120] flex items-center gap-2 select-none">
        <button id="music-toggle" onclick="toggleMusic()" title="背景音乐" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-white shadow-xl cursor-pointer transition-transform hover:scale-110">
            <i id="music-icon" class="fas fa-volume-xmark text-base"></i>
        </button>
        <div id="music-panel" class="hidden glass-card rounded-full pl-3 pr-3 py-2 flex items-center gap-2 shadow-xl">
            <i class="fas fa-music text-xs text-pink-300"></i>
            <span id="music-title" class="text-xs text-white font-medium max-w-[120px] truncate">未播放</span>
            <input id="music-vol" type="range" min="0" max="100" value="60" oninput="setMusicVol(this.value)" class="w-20 accent-pink-400 cursor-pointer">
        </div>
    </div>
    <audio id="bg-audio" loop preload="none" crossorigin="anonymous"></audio>

    <!-- 雪花动画画布（固定背景层） -->
    <canvas id="snow-canvas" class="fixed inset-0 pointer-events-none z-[60]"></canvas>

    <!-- 网站图标：默认是 芝士 卷 Emoji 的 SVG 内联，免额外文件。如需更换，把下方 href 换为自定义图标的 .ico / .png / .svg 地址即可（建议放在仓库根目录的 favicon.ico） -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>%F0%9F%A7%80</text></svg>">
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
        }
        body.theme-light .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .glass-input {
            background: rgba(0, 0, 0, 0.04);
            color: #000;
        }
        body.theme-light input::placeholder { color: #94a3b8; }
        body.theme-light #engine-menu { background: #ffffff; border-color: #e2e8f0; }
        body.theme-light #engine-menu button { color: #334155; }
        body.theme-light #engine-menu button:hover { background: rgba(79, 70, 229, 0.08); }
        body.theme-light .prose-content h1,
        body.theme-light .prose-content h2,
        body.theme-light .prose-content h3 { color: #1e293b; }
        body.theme-light .prose-content p,
        body.theme-light .prose-content li { color: #334155; }
        body.theme-light .prose-content code { background: #f1f5f9; color: #7c3aed; }
        body.theme-light .prose-content pre { background: #1e293b; }
        body.theme-light .prose-content blockquote { border-color: #c7d2fe; color: #475569; }

        body.theme-dark {
            background:
                radial-gradient(ellipse 90% 55% at 50% 0%, rgba(140, 30, 50, 0.55) 0%, rgba(140, 30, 50, 0.15) 30%, rgba(0, 0, 0, 0) 70%),
                radial-gradient(ellipse 60% 40% at 20% 0%, rgba(180, 40, 80, 0.18) 0%, rgba(0, 0, 0, 0) 60%),
                linear-gradient(180deg, #1a0712 0%, #0a0408 100%);
            color: #f8fafc;
            background-attachment: fixed;
        }
        body.theme-dark .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body.theme-dark .glass-input {
            background: rgba(255, 255, 255, 0.07);
        }
        body.theme-dark .prose-content h1,
        body.theme-dark .prose-content h2,
        body.theme-dark .prose-content h3 { color: #e2e8f0; }
        body.theme-dark .prose-content p,
        body.theme-dark .prose-content li { color: #cbd5e1; }
        body.theme-dark .prose-content code { background: #1e293b; color: #a78bfa; }
        body.theme-dark .prose-content pre { background: #0f172a; }
        body.theme-dark .prose-content blockquote { border-color: #4f46e5; color: #94a3b8; }

        body.theme-dark.has-custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(58, 10, 26, 0.45) 0%, rgba(10, 4, 8, 0.55) 100%);
            backdrop-filter: blur(2px);
            z-index: -1;
        }
        body.theme-light.has-custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(248, 250, 252, 0.4);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        body, .glass-card, .glass-input {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body:not(.is-admin) .admin-only {
            display: none !important;
        }

        .article-card:hover .article-arrow {
            transform: translateX(4px);
        }

        /* Prose styles for article content */
        .prose-content { line-height: 1.8; font-size: 15px; }
        .prose-content h1 { font-size: 1.75rem; font-weight: 800; margin: 2rem 0 1rem; }
        .prose-content h2 { font-size: 1.375rem; font-weight: 700; margin: 1.75rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(99,102,241,0.2); }
        .prose-content h3 { font-size: 1.125rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
        .prose-content p { margin: 0.875rem 0; }
        .prose-content ul { list-style: disc; padding-left: 1.5rem; margin: 0.75rem 0; }
        .prose-content ol { list-style: decimal; padding-left: 1.5rem; margin: 0.75rem 0; }
        .prose-content li { margin: 0.3rem 0; }
        .prose-content a { color: #818cf8; text-decoration: underline; }
        .prose-content a:hover { color: #a5b4fc; }
        .prose-content code {
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.85em;
            padding: 0.15em 0.4em;
            border-radius: 4px;
        }
        .prose-content pre {
            border-radius: 10px;
            padding: 1.25rem;
            overflow-x: auto;
            margin: 1.25rem 0;
        }
        .prose-content pre code { background: none; padding: 0; font-size: 0.875rem; }
        .prose-content blockquote {
            border-left: 3px solid;
            padding: 0.5rem 0 0.5rem 1.25rem;
            margin: 1.25rem 0;
            font-style: italic;
        }
        .prose-content img { max-width: 100%; border-radius: 10px; margin: 1rem 0; }
        .prose-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .prose-content th { padding: 0.6rem 1rem; text-align: left; font-weight: 600; }
        .prose-content td { padding: 0.6rem 1rem; border-top: 1px solid rgba(99,102,241,0.15); }
        body.theme-dark .prose-content th { background: rgba(99,102,241,0.1); }
        body.theme-light .prose-content th { background: rgba(99,102,241,0.08); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s ease both; }
        .animate-fade-in-delay { animation: fadeIn 0.6s 0.1s ease both; }
        .animate-fade-in-delay2 { animation: fadeIn 0.6s 0.2s ease both; }

        .tag-pill { transition: all 0.2s; }
        .tag-pill:hover { transform: translateY(-1px); }

        /* Rin 风格导航选中态 */
        .nav-link { color: inherit; }
        body.theme-light .nav-link { color: #475569; }
        body.theme-dark .nav-link { color: #cbd5e1; }
        .nav-link.is-active { color: #818cf8 !important; background: rgba(129,140,248,0.12); }

        /* view 切换动画 */
        .view-section { animation: fadeIn 0.45s ease both; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.5); }
    </style>
</head>
<body class="theme-dark font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 个性化设置面板 -->
    <div class="fixed top-5 right-5 z-[150]">
        <button aria-label="设置" onclick="toggleThemeMenu(event)" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-400 hover:text-indigo-400 hover:scale-105 active:scale-95 transition-all shadow-lg cursor-pointer">
            <i id="theme-icon" class="fas fa-palette text-sm"></i>
        </button>
        <div id="theme-panel" class="absolute right-0 top-full mt-2 w-60 bg-slate-900/95 border border-slate-700/80 rounded-2xl shadow-2xl hidden backdrop-blur-md p-4 space-y-3 z-[160]" onclick="event.stopPropagation()">
            <div class="text-[11px] font-bold text-slate-400 px-1 mb-1.5">语言 / Language</div>
            <div class="flex gap-2 mb-3 border-b border-slate-800 pb-3">
                <button onclick="setLanguage('zh')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">中文</button>
                <button onclick="setLanguage('en')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">English</button>
            </div>
            <div class="text-[11px] font-bold text-slate-400 px-1">基础色彩模式</div>
            <div class="flex gap-2">
                <button onclick="setBaseTheme('theme-light')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-sun text-amber-500"></i> 日间</button>
                <button onclick="setBaseTheme('theme-dark')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-moon text-indigo-400"></i> 夜间</button>
            </div>
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] text-slate-400 font-bold">自定义背景 (云端同步)</label>
                    <button onclick="clearCustomBg()" id="clear-bg-btn" class="text-[10px] text-red-400 hover:underline hidden">清除壁纸</button>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="custom-bg-input" placeholder="输入图片网址 https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="applyCustomBg()" class="bg-indigo-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-indigo-500 cursor-pointer shrink-0">应用</button>
                </div>
            </div>
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <label class="text-[11px] text-slate-400 font-bold">修改管理员密码 (云端同步)</label>
                <div class="flex gap-1.5">
                    <input type="password" id="custom-pwd-input" placeholder="输入新密码" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    <button onclick="updateAdminPwd()" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-emerald-500 cursor-pointer shrink-0">保存</button>
                </div>
            </div>
            <div class="admin-only border-t border-slate-800 pt-2 mt-2">
                <button onclick="logoutAdmin()" class="w-full py-1.5 rounded-lg bg-red-950/40 border border-red-900/40 text-red-400 text-[11px] text-center hover:bg-red-900/40 transition-colors cursor-pointer">退出后台管理</button>
            </div>
        </div>
    </div>

    <!-- Rin 风格 Header：sticky 顶栏，胶囊导航 -->
    <header class="sticky top-0 z-50 pt-4">
        <div class="max-w-6xl mx-auto px-4">
            <div class="glass-card rounded-full pl-4 pr-3 py-2 flex items-center justify-between gap-3 shadow-2xl">
                <!-- 品牌区：头像 + 名字 -->
                <a href="#home" onclick="showView('home');return false" class="flex items-center gap-2.5 shrink-0 group">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white font-bold text-base shadow-md group-hover:scale-105 transition-transform">
                        <span id="brand-avatar">🧀</span>
                    </div>
                    <span id="brand-name" class="hidden sm:inline font-bold text-base tracking-wide">芝士卷OvO</span>
                </a>

                <!-- 胶囊导航 -->
                <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
                    <a href="#home" data-route="home" onclick="showView('home');return false" class="nav-link px-4 py-2 rounded-full transition-colors hover:bg-white/10 text-indigo-400">文章</a>
                    <a href="#friends" data-route="friends" onclick="showView('friends');return false" class="nav-link px-4 py-2 rounded-full transition-colors hover:bg-white/10">朋友们</a>
                    <a href="#about" data-route="about" onclick="showView('about');return false" class="nav-link px-4 py-2 rounded-full transition-colors hover:bg-white/10">关于</a>
                </nav>

                <!-- 右侧操作区：语言切换 + 登录 -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="setLanguage(lang==='zh'?'en':'zh')" title="语言 / Language" class="w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center text-sm font-semibold transition-colors">
                        <span id="lang-flag">中</span>
                    </button>
                    <button id="search-toggle" onclick="toggleSearchBar()" class="w-9 h-9 rounded-full hover:bg-white/10 flex items-center justify-center transition-colors" title="搜索">
                        <i class="fas fa-search text-sm"></i>
                    </button>
                    <div class="relative">
                        <button onclick="openUserAuth()" id="login-btn" class="px-3 py-1.5 rounded-full text-sm font-semibold bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 transition-colors shadow-md text-white flex items-center gap-1.5 cursor-pointer">
                            <span id="login-avatar-wrap"><i class="fas fa-user-circle"></i></span><span id="login-label">登录</span>
                        </button>
                        <!-- 已登入下拉 -->
                        <div id="user-menu" class="hidden absolute right-0 top-full mt-2 w-56 glass-card rounded-xl p-2 z-[120] shadow-2xl">
                            <div class="px-3 py-2 border-b border-white/10 mb-1">
                                <div class="flex items-center gap-2">
                                    <div id="user-menu-avatar" class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-sm font-bold overflow-hidden"></div>
                                    <div class="min-w-0">
                                        <div id="user-menu-name" class="text-sm font-semibold text-white truncate"></div>
                                        <div id="user-menu-handle" class="text-xs text-slate-400 truncate"></div>
                                    </div>
                                </div>
                            </div>
                            <button onclick="openProfileModal(); closeUserMenu()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/10 text-sm text-slate-200 transition-colors cursor-pointer"><i class="fas fa-id-card mr-2 text-indigo-400"></i>个人资料</button>
                            <button onclick="logoutUser()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/10 text-sm text-slate-200 transition-colors cursor-pointer"><i class="fas fa-sign-out-alt mr-2 text-rose-400"></i>退出登录</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 搜索栏（默认隐藏） -->
        <div id="search-bar-wrap" class="max-w-2xl mx-auto px-4 mt-3 hidden">
            <form id="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" class="relative">
                <div class="flex items-center glass-input rounded-2xl border border-slate-700/40 shadow-xl focus-within:border-indigo-500/80 transition-all duration-300">
                    <div class="relative pl-3">
                        <button type="button" id="engine-btn" onclick="toggleEngineMenu(event)" class="flex items-center space-x-1.5 text-slate-400 hover:text-indigo-400 transition-colors py-3 pr-1 cursor-pointer">
                            <i id="engine-icon" class="fab fa-google text-blue-400"></i>
                            <i class="fas fa-chevron-down text-[10px] opacity-50"></i>
                        </button>
                        <div id="engine-menu" class="absolute left-2 top-full mt-2 w-32 bg-slate-950/95 border border-slate-800 rounded-xl shadow-2xl hidden backdrop-blur-md overflow-hidden z-[110]">
                            <button type="button" onclick="selectEngine('google')" class="w-full text-left px-3 py-2 hover:bg-indigo-600/20 text-xs flex items-center space-x-2 cursor-pointer"><i class="fab fa-google text-blue-400"></i> <span>Google</span></button>
                            <button type="button" onclick="selectEngine('bing')" class="w-full text-left px-3 py-2 hover:bg-indigo-600/20 text-xs flex items-center space-x-2 cursor-pointer"><i class="fab fa-microsoft text-teal-400"></i> <span>Bing</span></button>
                            <button type="button" onclick="selectEngine('baidu')" class="w-full text-left px-3 py-2 hover:bg-indigo-600/20 text-xs flex items-center space-x-2 cursor-pointer"><i class="fas fa-paw text-red-400"></i> <span>Baidu</span></button>
                            <button type="button" onclick="selectEngine('github')" class="w-full text-left px-3 py-2 hover:bg-indigo-600/20 text-xs flex items-center space-x-2 cursor-pointer"><i class="fab fa-github text-slate-400"></i> <span>GitHub</span></button>
                        </div>
                    </div>
                    <input type="text" id="search-input" name="q" placeholder="在 Google 中搜索..." autocomplete="off" class="w-full bg-transparent border-none py-3 px-2 focus:outline-none text-sm">
                    <button type="submit" class="mr-2 p-2 text-slate-400 hover:text-indigo-400 transition-colors">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </form>
        </div>
    </header>

    <!-- 主体内容容器 -->
    <main class="max-w-3xl mx-auto px-4 pt-8 pb-12">

        <!-- 时间 + 天气 横条（保留） -->
        <div class="text-center mb-8 animate-fade-in">
            <h1 id="clock" class="text-5xl lg:text-7xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 mb-2">00:00:00</h1>
            <div class="flex items-center justify-center space-x-3 text-sm md:text-base font-medium tracking-wide opacity-90">
                <span id="greeting" class="text-indigo-400">正在筹备问候语...</span>
                <span class="opacity-30">|</span>
                <span id="weather-info" class="flex items-center gap-1.5 text-emerald-400">
                    <i class="fas fa-spinner fa-spin text-xs"></i> <span>正在定位...</span>
                </span>
            </div>
        </div>

        <!-- ============= 文章页（home） ============= -->
        <section id="view-home" class="view-section">
            <!-- 博客头部 -->
            <div class="text-center mb-8 animate-fade-in-delay2">
                <h2 class="text-2xl lg:text-3xl font-bold mb-2">
                    <i class="fas fa-blog text-indigo-400 mr-2"></i> Blog
                </h2>
                <p class="text-slate-400 text-sm" id="blog-subtitle">记录思考，分享技术，偶尔生活</p>
            </div>

            <!-- 标签筛选 -->
            <div class="flex flex-wrap justify-center gap-2 mb-6" id="tag-filter">
                <button onclick="filterByTag(null)" class="tag-pill px-4 py-1.5 rounded-full text-xs font-medium glass-card border border-indigo-500/30 text-indigo-400">全部</button>
            </div>

            <!-- 文章网格 -->
            <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <!-- JS 动态渲染 -->
            </div>
        </section>

        <!-- ============= 朋友们页（friends） ============= -->
        <section id="view-friends" class="view-section hidden">
            <div class="text-center mb-8 animate-fade-in">
                <h2 class="text-2xl lg:text-3xl font-bold mb-2">
                    <i class="fas fa-user-friends text-indigo-400 mr-2"></i> 朋友们
                </h2>
                <p class="text-slate-400 text-sm">一些有趣的人与站点</p>
            </div>
            <div class="glass-card rounded-2xl p-10 text-center">
                <i class="fas fa-seedling text-5xl text-indigo-400/40 mb-4"></i>
                <h3 class="text-lg font-semibold text-slate-300 mb-2">友链筹备中</h3>
                <p class="text-sm text-slate-400 leading-relaxed max-w-md mx-auto">这里将列出我关注的朋友们的博客。<br>目前还在收集，暂未上线，敬请期待 🌱</p>
            </div>
        </section>

        <!-- ============= 关于页（about） ============= -->
        <section id="view-about" class="view-section hidden">
            <div class="text-center mb-8 animate-fade-in">
                <h2 class="text-2xl lg:text-3xl font-bold mb-2">
                    <i class="fas fa-id-card text-indigo-400 mr-2"></i> 关于
                </h2>
                <p class="text-slate-400 text-sm">关于这个站点 & 关于我</p>
            </div>

            <div class="glass-card rounded-2xl p-6 md:p-8 mb-4">
                <div class="flex items-start gap-5">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-2xl font-bold text-white shrink-0">
                        C
                    </div>
                    <div>

    <script>
    // ============================================================
    // 全局状态
    // ============================================================
    let isAdmin = false;
    let adminPwd = 'admin888';
    let articles = [];
    let currentTag = null;
    let editingSlug = null;
    let searchEngine = localStorage.getItem('searchEngine') || 'google';
    let baseTheme = localStorage.getItem('baseTheme') || 'theme-dark';
    let lang = localStorage.getItem('lang') || 'zh';
    let siteConfig = {};
    let customBgApplied = false;

    const i18n = {
        zh: {
            greeting: ['早上好', '上午好', '中午好', '下午好', '傍晚好', '晚上好', '夜深了'],
            weatherLoading: '正在定位...',
            searchGoogle: '在 Google 中搜索...',
            searchBing: '在 Bing 中搜索...',
            searchBaidu: '在百度中搜索...',
            searchGithub: '在 GitHub 中搜索...',
            blogSubtitle: '记录思考，分享技术，偶尔生活',
            tagAll: '全部',
            articleCount: (n) => `共 ${n} 篇文章`,
            noArticle: '暂无文章，管理员可点击上方 + 添加',
            noArticleAdmin: '点击上方 + 添加第一篇文章',
        },
        en: {
            greeting: ['Good Morning', 'Good Morning', 'Noon', 'Good Afternoon', 'Good Evening', 'Good Evening', 'Late Night'],
            weatherLoading: 'Locating...',
            searchGoogle: 'Search Google...',
            searchBing: 'Search Bing...',
            searchBaidu: 'Search Baidu...',
            searchGithub: 'Search GitHub...',
            blogSubtitle: 'Thoughts, tech, and sometimes life',
            tagAll: 'All',
            articleCount: (n) => `${n} article${n !== 1 ? 's' : ''}`,
            noArticle: 'No articles yet',
            noArticleAdmin: 'Click + above to add the first article',
        }
    };

    // ============================================================
    // 工具函数
    // ============================================================
    function $(id) { return document.getElementById(id); }
    function slugify(title) {
        return title.toLowerCase().replace(/[^\w\u4e00-\u9fa5]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || Date.now().toString();
    }
    function parseMarkdown(text) {
        return text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/^# (.+)$/gm, '<h1>$1</h1>')
            .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
            .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
            .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
            .replace(/^- (.+)$/gm, '<li>$1</li>')
            .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
            .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
            .replace(/^---$/gm, '<hr>')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>')
            .replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
    }

    // ============================================================
    // View 路由切换（Rin 风格页面：home / friends / about）
    // ============================================================
    let currentView = 'home';
    function showView(name) {
        currentView = name;
        // 隐藏所有 view-section + 详情页
        ['home','friends','about'].forEach(v => {
            const el = $('view-' + v);
            if (el) el.classList.add('hidden');
        });
        $('article-detail-view').classList.add('hidden');
        // 显示目标 view
        const target = $('view-' + name);
        if (target) target.classList.remove('hidden');
        // 同步顶部导航高亮
        document.querySelectorAll('.nav-link').forEach(a => {
            a.classList.toggle('is-active', a.dataset.route === name);
        });
        // URL hash
        if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
        // about 页重新渲染 updates 内容（可能刚刚被编辑）
        if (name === 'about' && typeof renderUpdates === 'function') renderUpdates();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function toggleSearchBar() {
        const w = $('search-bar-wrap');
        if (!w) return;
        w.classList.toggle('hidden');
        if (!w.classList.contains('hidden')) $('search-input').focus();
    }

    // ============================================================
    // 更新内容（关于页内可编辑模块，本地存储）
    // ============================================================
    const UPDATES_KEY = 'siteUpdates';
    function loadUpdates() {
        return localStorage.getItem(UPDATES_KEY) || '';
    }
    function saveUpdatesToStorage(text) {
        localStorage.setItem(UPDATES_KEY, text);
    }
    function renderUpdates() {
        const el = $('updates-content');
        if (!el) return;
        const txt = loadUpdates();
        if (!txt) {
            el.innerHTML = `<p class="text-slate-500 italic">${isAdmin ? '点击右上角“编辑”按钮添加更新内容' : '暂无更新'}</p>`;
        } else {
            el.innerHTML = `<div>${parseMarkdown(txt)}</div>`;
        }
    }
    function openUpdatesModal() {
        if (!isAdmin) return;
        const ta = $('updates-input');
        if (ta) ta.value = loadUpdates();
        const err = $('updates-error'); if (err) err.classList.add('hidden');
        $('updates-modal').classList.remove('hidden');
    }
    function closeUpdatesModal() {
        $('updates-modal').classList.add('hidden');
    }
    function saveUpdates() {
        const ta = $('updates-input');
        if (!ta) return;
        saveUpdatesToStorage(ta.value);
        renderUpdates();
        closeUpdatesModal();
    }
    function clearUpdates() {
        const ta = $('updates-input');
        if (ta) ta.value = '';
    }

    // ============================================================
    // 主题 & 语言
    // ============================================================
    function setBaseTheme(theme) {
        baseTheme = theme;
        localStorage.setItem('baseTheme', theme);
        applyTheme();
    }
    function applyTheme() {
        // 同步真实管理员状态（管理员后台密码 || user.isAdmin）
        const effectiveAdmin = isAdmin || isUserAdmin();
        document.body.className = baseTheme + ' font-sans antialiased selection:bg-indigo-500 selection:text-white';
        document.body.classList.toggle('is-admin', effectiveAdmin);
        if (customBgApplied) document.body.classList.add('has-custom-bg');
        else document.body.classList.remove('has-custom-bg');
    }
    function setLanguage(l) {
        lang = l;
        localStorage.setItem('lang', l);
        applyLanguage();
        renderArticles();
    }
    function applyLanguage() {
        const t = i18n[lang];
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        $('search-input').placeholder = t['search' + searchEngine.charAt(0).toUpperCase() + searchEngine.slice(1)];
        $('blog-subtitle').textContent = t.blogSubtitle;
        // 同步 header 多语言文案
        const navMap = { home: t.navHome || '文章', friends: t.navFriends || '朋友们', about: t.navAbout || '关于' };
        document.querySelectorAll('.nav-link').forEach(a => {
            const txt = navMap[a.dataset.route];
            if (txt) a.textContent = txt;
        });
        const langFlag = $('lang-flag');
        if (langFlag) langFlag.textContent = (lang === 'zh' ? '中' : 'EN');
        const loginLabel = $('login-label');

    function updateClock() {
        const now = new Date();
        const h = now.getHours();
        const t = i18n[lang].greeting[Math.min(Math.floor(h / 4), 6)];
        $('clock').textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        $('greeting').textContent = t;
    }
    function fetchWeather() {
        // 走自己 Pages 域的代理，绕过 CORS / 限流
        const url = '/api/weather?lang=' + (lang === 'zh' ? 'zh' : 'en');
        fetch(url)
            .then(r => r.text())
            .then(d => {
                const raw = (d || '').trim();
                if (!raw || /<[^>]+>/.test(raw) || /^ERR:/.test(raw)) throw new Error('bad weather payload');
                const parts = raw.split(/\s+/);
                if (parts.length >= 2) {
                    const temp = parts[0], cond = parts.slice(1).join(' ');
                    const wi = $('weather-info');
                    wi.textContent = '';
                    const i = document.createElement('i');
                    i.className = 'fas fa-cloud text-xs';
                    const s = document.createElement('span');
                    s.textContent = ' ' + cond + ' ' + temp;
                    wi.appendChild(i);
                    wi.appendChild(s);
                }
            })
            .catch(() => {
                const wi = $('weather-info');
                wi.textContent = '';
                const i = document.createElement('i');
                i.className = 'fas fa-globe text-xs';
                const s = document.createElement('span');
                s.textContent = ' ' + (lang === 'zh' ? '天气服务不可用' : 'Weather unavailable');
                wi.appendChild(i);
                wi.appendChild(s);
            });
    }

    async function submitLogin() {
        const u = $('login-username').value.trim();
        const p = $('login-password').value;
        if (!u || !p) return showUserAuthError('请输入用户名和密码');
        setSubmitting(true);
        try {
            const r = await fetch('/api/users', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', username: u, password: p })
            });
            const d = await r.json();
            if (!r.ok || !d.ok) { showUserAuthError(d.error || '登录失败'); return; }
            authToken = d.token; localStorage.setItem('authToken', authToken);
            currentUser = d.user;
            applyUserUI();
            closeUserAuth();
        } catch (e) { showUserAuthError('网络错误：' + e.message); }
        finally { setSubmitting(false); }
    }

        if (!el) return;
        el.innerHTML = '';
        if (user && user.avatar) {
            const v = String(user.avatar);

                const img = document.createElement('img');
                img.src = v; img.className = 'w-full h-full object-cover';
                el.appendChild(img);
                return;
            }
            // 表情 / 文本
            el.textContent = v;
        } else {
            el.textContent = (user && (user.displayName || user.username) || fallbackLetter || '?').charAt(0).toUpperCase();
        }
    }

    async function saveArticle() {
        const title = $('art-title').value.trim();
        const tagsRaw = $('art-tags').value.trim();
        const date = $('art-date').value.trim();
        const author = $('art-author').value.trim() || 'CheeseRoll';
        const content = $('art-content').value;
        if (!title) { $('art-error').textContent = lang === 'zh' ? '请填写标题' : 'Title is required'; $('art-error').classList.remove('hidden'); return; }
        const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];
        const slug = editingSlug || slugify(title);
        if (editingSlug) {
            const idx = articles.findIndex(x => x.slug === editingSlug);
            if (idx >= 0) { articles[idx] = { ...articles[idx], title, tags, date, author, content }; }
        } else {
            if (articles.find(x => x.slug === slug)) { $('art-error').textContent = lang === 'zh' ? '该标题已存在，请换一个' : 'Title already exists, please use a different one'; $('art-error').classList.remove('hidden'); return; }
            articles.unshift({ slug, title, tags, date, author, content });
        }
        await saveArticles();
        closeArticleModal();
        renderArticles();
    }

        const i = document.getElementById('music-icon');
        if (!i) return;
        i.className = playing ? 'fas fa-volume-high text-base' : 'fas fa-volume-xmark text-base';
    }
    function playMusic() {
        const a = getAudio();
        a.src = MUSIC_LIST[musicIdx].src;
        a.volume = (parseInt(document.getElementById('music-vol').value, 10) || 60) / 100;
        setMusicTitle(MUSIC_LIST[musicIdx].title);
        a.play().then(() => { musicPlaying = true; setMusicIcon(true); }).catch(() => { musicPlaying = false; setMusicIcon(false); });
    }
    function pauseMusic() {
        const a = getAudio();
        a.pause(); musicPlaying = false; setMusicIcon(false);
    }
    function toggleMusic() {
        const panel = document.getElementById('music-panel');
        if (musicPlaying) pauseMusic();
        else { playMusic(); panel.classList.remove('hidden'); }
    }
    function setMusicVol(v) {
        const a = getAudio(); a.volume = (parseInt(v, 10) || 0) / 100;
    }
    function nextMusic() {
        musicIdx = (musicIdx + 1) % MUSIC_LIST.length;
        if (musicPlaying) playMusic();
        else setMusicTitle(MUSIC_LIST[musicIdx].title);
    }
    document.addEventListener('DOMContentLoaded', () => {
        const a = getAudio();
        a.addEventListener('ended', nextMusic);
    });
    // 首次点击页面任意位置才自动尝试播放（浏览器策略）
    let userInteracted = false;
    function firstClickHintPlay() {
        if (userInteracted) return;
        userInteracted = true;
        // 不主动播放，只解除静音限制；用户点 music 按钮才播
    }
    document.addEventListener('click', firstClickHintPlay, { once: true });

    // ============================================================
    // 雪花背景动画
    // ============================================================
    (function initSnow() {
        const cvs = document.getElementById('snow-canvas');
        if (!cvs) return;
        const ctx = cvs.getContext('2d');
        const flakes = [];
        const COUNT = 80;
        let w = 0, h = 0;
        function resize() {
            w = cvs.width = window.innerWidth;
            h = cvs.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        for (let i = 0; i < COUNT; i++) {
            flakes.push(makeFlake(true));
        }
        function makeFlake(initial) {
            const r = Math.random() * 2.4 + 0.6; // 半径
            return {
                x: Math.random() * w,
                y: initial ? Math.random() * h : -10,
                r,
                vy: 0.3 + r * 0.25 + Math.random() * 0.3,
                vx: (Math.random() - 0.5) * 0.4,
                swing: Math.random() * Math.PI * 2,
                swingSpeed: 0.01 + Math.random() * 0.02,
                swingAmp: 0.3 + Math.random() * 0.8,
                opacity: 0.5 + Math.random() * 0.5
            };
        }
        function draw() {
            ctx.clearRect(0, 0, w, h);
            for (const f of flakes) {
                f.swing += f.swingSpeed;
                f.x += f.vx + Math.sin(f.swing) * f.swingAmp;
                f.y += f.vy;
                if (f.y > h + 5) { Object.assign(f, makeFlake(false)); f.x = Math.random() * w; }
                if (f.x < -10) f.x = w + 5;
                if (f.x > w + 10) f.x = -5;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,' + f.opacity.toFixed(2) + ')';
                ctx.fill();
                // 中心略亮一点
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,' + (f.opacity * 0.7).toFixed(2) + ')';
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }
        // 暗色模式才启用雪花（背景偏暗才看得见）
        function tickLoop() {
            if (document.body.classList.contains('dark')) {
                cvs.style.opacity = '1';
            } else {
                cvs.style.opacity = '0';
            }
            requestAnimationFrame(tickLoop);
        }
        cvs.style.transition = 'opacity 0.4s';
        draw();
        tickLoop();
    })();

    (async function init() {
        applyTheme();
        applyLanguage();
        updateClock();
        setInterval(updateClock, 1000);
        fetchWeather();
        selectEngine(searchEngine);
        await loadSiteConfig();
        await loadArticles();
        await loadCurrentUser();
        applyTheme();
        renderUpdates();
        // 根据 URL hash 初始化 view
        const initial = (location.hash || '#home').replace('#', '');
        if (['home','friends','about'].includes(initial)) showView(initial);
        // hashchange 路由
        window.addEventListener('hashchange', () => {
            const v = (location.hash || '#home').replace('#', '');
            if (['home','friends','about'].includes(v)) showView(v);
        });
    })();
    </script>
